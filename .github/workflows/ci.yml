name: Rust Date Parsing

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version: 1.27.1
          cache-dependency-path: tools/go-reference/go.sum
      - if: runner.os == 'Linux'
        run: go -C tools/go-reference vet -mod=readonly ./...
      - if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: go1.27.1
          CGO_ENABLED: '0'
          TZ: UTC
        run: go -C tools/go-reference run -mod=readonly . -output ../../target/go-reference.json
      - if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: go1.27.1
          CGO_ENABLED: '0'
          GOMAXPROCS: '1'
          TZ: UTC
        run: go -C tools/go-reference run -mod=readonly . -features-output ../../target/go-features-reference.json
      - if: runner.os == 'Linux'
        run: cargo test --locked --lib live_go_ -- --ignored --nocapture
      - if: runner.os == 'Linux'
        run: git diff --exit-code -- data/locales.json data/calendars.json data/calendar-conversions.json src/timezone_data.rs LICENSE THIRD_PARTY_NOTICES.md